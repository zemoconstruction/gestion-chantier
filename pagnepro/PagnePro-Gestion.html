<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PagnePro Gestion</title>
<meta name="theme-color" content="#1f2766">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: indigo "adire" sidebar (the one bold surface) + quiet working canvas; drawer on phones */
:root{
  --bg:#f3f3f8; --surface:#ffffff; --surface-2:#f8f8fc; --ink:#1a1c38; --muted:#5c6082; --faint:#8e91ad; --line:#e1e2ee;
  --indigo:#1f2766; --indigo-2:#2c3690; --on-indigo:#eceefe; --on-indigo-dim:#a9aee0;
  --accent:#2f3aa0; --accent-soft:#e7e9fb; --ochre:#d08a1c; --ochre-soft:#fbf0dc;
  --good:#1d8456; --good-soft:#e2f4ea; --warn:#b86b0d; --warn-soft:#fdf0dc; --bad:#c23a3a; --bad-soft:#fbe6e6;
  --shadow:0 1px 2px rgba(26,28,56,.06),0 4px 16px rgba(26,28,56,.05);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1120; --surface:#171a2d; --surface-2:#1c2036; --ink:#e7e8f6; --muted:#a2a5c4; --faint:#6f7396; --line:#2a2e4a;
  --indigo:#141842; --indigo-2:#222a70; --on-indigo:#eceefe; --on-indigo-dim:#9ca1d6;
  --accent:#9aa4ff; --accent-soft:#252b55; --ochre:#f0a83c; --ochre-soft:#3a2d17;
  --good:#4cc68c; --good-soft:#15352a; --warn:#f0a44a; --warn-soft:#3a2a14; --bad:#ff7b7b; --bad-soft:#3d1c20;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1120; --surface:#171a2d; --surface-2:#1c2036; --ink:#e7e8f6; --muted:#a2a5c4; --faint:#6f7396; --line:#2a2e4a;
  --indigo:#141842; --indigo-2:#222a70; --on-indigo:#eceefe; --on-indigo-dim:#9ca1d6;
  --accent:#9aa4ff; --accent-soft:#252b55; --ochre:#f0a83c; --ochre-soft:#3a2d17;
  --good:#4cc68c; --good-soft:#15352a; --warn:#f0a44a; --warn-soft:#3a2a14; --bad:#ff7b7b; --bad-soft:#3d1c20;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.65rem;font-weight:800}
h2{font-size:1.1rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:var(--indigo);color:var(--on-indigo);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.side::after{content:"";position:absolute;inset:auto -60px -60px auto;width:260px;height:260px;border-radius:50%;
  background:repeating-radial-gradient(circle,transparent 0 9px,color-mix(in srgb,var(--ochre) 55%,transparent) 9px 11px);opacity:.22;pointer-events:none}
.brand{padding:22px 20px 16px;display:flex;gap:10px;align-items:center}
.logo{width:38px;height:38px;border-radius:10px;background:var(--ochre);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--f-display);font-size:1.15rem;font-weight:800;display:block;line-height:1.1}
.brand small{color:var(--on-indigo-dim);font-size:.78rem;display:block;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px;overflow:auto;flex:1;position:relative;z-index:1}
.nav .grp{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--on-indigo-dim);padding:14px 12px 4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:var(--on-indigo);font-weight:500;font-size:.93rem}
.nav button svg{width:18px;height:18px;opacity:.8;flex:none}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button.on{background:var(--indigo-2);box-shadow:inset 3px 0 0 var(--ochre)}
.nav button:focus-visible{outline:2px solid var(--ochre)}
.nav .badge{margin-left:auto;background:var(--ochre);color:#1a1c38;font-size:.7rem;font-weight:700;border-radius:20px;padding:1px 7px}
.side-foot{padding:12px 20px 18px;font-size:.75rem;color:var(--on-indigo-dim);position:relative;z-index:1}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.top{display:none}
.scrim{display:none}
.page{padding-block:26px 60px;padding-inline:clamp(16px,3vw,36px);max-width:1320px;width:100%}
.ph{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.ph p{margin:4px 0 0;color:var(--muted)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ochre);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h .sub{color:var(--muted);font-size:.83rem}
.kpi .l{font-size:.8rem;color:var(--muted);font-weight:500}
.kpi .v{font-family:var(--f-display);font-size:1.6rem;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .v small{font-size:.85rem;color:var(--muted);font-weight:500}
.kpi .s{font-size:.8rem;color:var(--muted);margin-top:2px}
.fund{border-top:3px solid var(--c,var(--accent))}
.fund .pct{font-size:.72rem;font-weight:700;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:1px 7px;border-radius:20px}
/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
:root[data-theme="dark"] .btn.pri{color:#10122a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#10122a}}
.btn.pri:hover{filter:brightness(1.08)}
.btn.och{background:var(--ochre);border-color:var(--ochre);color:#1a1c38}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:5px 10px;font-size:.82rem;border-radius:7px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn:focus-visible,.inp:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn svg{width:16px;height:16px}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 11px;min-width:0;width:100%}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
select.inp{cursor:pointer}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.search{position:relative;flex:1;min-width:180px}
.search svg{position:absolute;left:11px;top:50%;translate:0 -50%;width:16px;height:16px;color:var(--faint)}
.search .inp{padding-left:34px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:.82rem;cursor:pointer;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:6px 14px;border-radius:7px;font-weight:600;font-size:.86rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
/* tables */
.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-weight:600;color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
td.num{white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.sticky th{position:sticky;top:0;z-index:1}
.tall{max-height:520px;overflow:auto}
/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-good{background:var(--good-soft);color:var(--good)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--accent-soft);color:var(--accent)}
.p-mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.muted{color:var(--muted)} .small{font-size:.82rem} .bold{font-weight:700}
.pos{color:var(--good)} .neg{color:var(--bad)}
.empty{padding:28px 10px;text-align:center;color:var(--muted);font-size:.9rem}
.demo-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--ochre-soft);border:1px solid color-mix(in srgb,var(--ochre) 35%,transparent);color:var(--ink);border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:.88rem}
.demo-bar b{color:var(--warn)}
/* POS */
.pos-wrap{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:18px;align-items:start}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.prod{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px;display:flex;flex-direction:column;gap:6px;position:relative;min-height:92px}
.prod:hover{border-color:var(--accent)}
.prod:focus-visible{outline:2px solid var(--accent)}
.prod .nm{font-weight:600;font-size:.9rem;line-height:1.25}
.prod .pr{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;margin-top:auto}
.prod .st{font-size:.74rem;color:var(--muted)}
.prod.low .st{color:var(--warn);font-weight:600}
.prod.out{opacity:.55}
.prod .q{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--surface);font-size:.75rem;font-weight:700;border-radius:20px;min-width:22px;text-align:center;padding:1px 6px}
.cart{position:sticky;top:16px;display:flex;flex-direction:column;gap:12px}
.cl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.cl .nm{font-weight:600;font-size:.9rem}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{all:unset;cursor:pointer;width:28px;height:28px;display:grid;place-items:center;font-weight:700;color:var(--muted)}
.qty button:hover{background:var(--surface-2);color:var(--ink)}
.qty input{width:44px;text-align:center;border:0;background:transparent;font-weight:700;padding:0}
.total-box{background:var(--indigo);color:var(--on-indigo);border-radius:12px;padding:16px}
.total-box .big{font-family:var(--f-display);font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.qin{width:74px;text-align:right}
/* chart */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:10.5px;font-family:var(--f-body)}
.chart .bar{fill:var(--accent)}
.chart .bar.hl{fill:var(--ochre)}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .hit:hover+.bar,.chart g:hover .bar{filter:brightness(1.15)}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;padding:6px 9px;border-radius:7px;white-space:nowrap;opacity:0;transition:opacity .1s}
.hbar{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.85rem;padding:4px 0}
.hbar .tr{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.hbar .fl{height:100%;background:var(--accent);border-radius:0 5px 5px 0}
.hbar .fl.och{background:var(--ochre)}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.meter{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--good)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,12,30,.5);z-index:50;display:grid;place-items:center;padding:16px;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal.wide{width:min(820px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mb{padding:18px 20px;overflow:auto}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
#toast{position:fixed;bottom:22px;left:50%;translate:-50% 0;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:70;opacity:0;transition:opacity .2s,translate .2s;pointer-events:none;font-size:.9rem}
#toast.show{opacity:1;translate:-50% -6px}
/* ticket */
.ticket{font-family:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;font-size:13px;max-width:320px;margin:0 auto;background:#fff;color:#111;padding:16px;border:1px dashed #bbb}
.ticket .c{text-align:center} .ticket hr{border:0;border-top:1px dashed #999;margin:8px 0}
.ticket .r{display:flex;justify-content:space-between;gap:8px}
#printArea{display:none}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{display:block;position:absolute;left:0;top:0;width:100%}}
.hide-frame{}
.userbox{padding:10px 14px;margin:0 10px 6px;border-radius:10px;background:rgba(255,255,255,.08);position:relative;z-index:1;display:flex;align-items:center;gap:8px;font-size:.88rem}
.userbox:empty{display:none}
.userbox small{display:block;color:var(--on-indigo-dim);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em}
.userbox button{all:unset;cursor:pointer;margin-left:auto;font-size:.78rem;color:var(--ochre);font-weight:700;padding:4px 6px;border-radius:6px}
.userbox button:hover{background:rgba(255,255,255,.08)}
.userbox button:focus-visible{outline:2px solid var(--ochre)}
.btn:disabled{opacity:.45;cursor:default}
/* responsive */
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.pos-wrap{grid-template-columns:minmax(0,1fr)}.cart{position:static}.g-main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:40;transform:translateX(-100%);transition:transform .2s;height:100%;padding-top:env(safe-area-inset-top,0px)}
  .app.open .side{transform:none}
  .app.open .scrim{display:block}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39}
  .top{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--indigo);color:var(--on-indigo);padding:10px 16px}
  .top b{font-family:var(--f-display);font-weight:800}
  .top button{all:unset;cursor:pointer;display:grid;place-items:center;width:34px;height:34px;border-radius:8px}
  .g3,.g2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){.g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.kpi .v{font-size:1.3rem}.fgrid{grid-template-columns:minmax(0,1fr)}h1{font-size:1.35rem}.card{padding:14px}.prods{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>
<div class="app" id="app">
  <aside class="side" aria-label="Menu principal">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1a1c38" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="#1a1c38"/></svg></div>
      <div><b>PagnePro</b><small id="shopName">Ma boutique</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="userbox" id="userBox"></div>
    <div class="side-foot">Fonctionne hors ligne · données sur cet appareil</div>
  </aside>
  <div class="scrim" data-act="menu"></div>
  <div class="main">
    <div class="top"><button data-act="menu" aria-label="Ouvrir le menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><b>PagnePro</b><span id="topView" class="small" style="opacity:.75;margin-left:auto"></span></div>
    <main class="page" id="page"></main>
  </div>
</div>
<div id="modalRoot"></div>
<div id="tip"></div>
<div id="toast" role="status"></div>
<div id="printArea"></div>
<script>
"use strict";
/* ============ utilitaires ============ */
const KEY = 'pagnepro_v1';
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-5);
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const nowTime = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const fmt = n => Math.round(Number(n) || 0).toLocaleString('fr-FR').replace(/[  ]/g, ' ');
const F = n => fmt(n) + ' F';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const fDate = s => { if (!s) return ''; const d = new Date(s + 'T12:00:00'); return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }); };
const fDay = s => { const d = new Date(s + 'T12:00:00'); return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }); };
const fMonth = m => { const [y, mo] = m.split('-'); return MOIS[+mo - 1] + ' ' + y; };
const daysInMonth = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); };

/* ============ calculs ============ */
const art = id => DB.articles.find(a => a.id === id);
const artName = id => art(id)?.nom || '(article supprimé)';
const venteTotal = v => sum(v.lignes, l => l.q * l.p) - (v.remise || 0);

function stockMap() {
  const m = {};
  DB.articles.forEach(a => m[a.id] = { init: +a.stockInit || 0, ent: 0, vte: 0, atIn: 0, atOut: 0 });
  DB.entrees.forEach(e => { if (m[e.a]) m[e.a].ent += +e.q; });
  DB.ventes.forEach(v => v.lignes.forEach(l => { if (m[l.a]) m[l.a].vte += +l.q; }));
  DB.confections.forEach(c => {
    if (c.statut === 'Annulé') return;
    c.mp.forEach(x => { if (m[x.a]) m[x.a].atOut += +x.q; });
    if (m[c.pf]) m[c.pf].atIn += +c.qRecue || 0;
  });
  for (const k in m) { const s = m[k]; s.actuel = s.init + s.ent + s.atIn - s.vte - s.atOut; s.recu = s.init + s.ent + s.atIn; s.rot = s.vte / Math.max(1, (s.init + s.ent + s.atIn + Math.max(0, s.actuel)) / 2); }
  return m;
}
function stockStatus(a, s) {
  if (s.actuel <= 0) return ['Rupture', 'p-bad'];
  if (s.actuel <= (+a.seuil || 0)) return ['Stock faible', 'p-warn'];
  return ['OK', 'p-good'];
}
const caOf = (from, to) => sum(DB.ventes.filter(v => v.date >= from && v.date <= to), v => v.total);
const salesByDay = () => { const m = {}; DB.ventes.forEach(v => m[v.date] = (m[v.date] || 0) + v.total); return m; };
function qtyByArticle(from, to) {
  const m = {}; DB.ventes.forEach(v => { if (v.date < from || v.date > to) return; v.lignes.forEach(l => { m[l.a] = m[l.a] || { q: 0, ca: 0 }; m[l.a].q += l.q; m[l.a].ca += l.q * l.p; }); });
  return m;
}
/* retraits par fonds pour une date ou période */
function retraits(from, to) {
  const r = { stock: 0, charges: 0, reserve: 0, profit: 0 };
  DB.entrees.forEach(e => { if (e.date >= from && e.date <= to) r.stock += +e.montant || 0; });
  DB.depenses.forEach(d => { if (d.date >= from && d.date <= to && r[d.fonds] != null) r[d.fonds] += +d.montant || 0; });
  return r;
}
function fundBalances(upTo) {
  upTo = upTo || '9999-12-31';
  const ca = caOf('0000-01-01', upTo); const sp = DB.settings.split; const r = retraits('0000-01-01', upTo);
  const o = {}; FUNDS.forEach(f => { const alloc = ca * (sp[f.k] || 0) / 100; o[f.k] = { alloc, out: r[f.k], solde: alloc - r[f.k] }; });
  return o;
}
function caisseDay(d) {
  const j = DB.caisseJours[d] || {};
  const fond = j.fond != null ? +j.fond : (() => { const prev = Object.keys(DB.caisseJours).filter(k => k < d).sort().pop(); return prev && DB.caisseJours[prev].compte != null ? +DB.caisseJours[prev].compte : 0; })();
  const ventesEsp = sum(DB.ventes.filter(v => v.date === d && v.mode === 'Espèces'), v => v.total);
  const ventesMM = sum(DB.ventes.filter(v => v.date === d && v.mode !== 'Espèces' && v.mode !== 'Commande'), v => v.total);
  let vers = 0, versMM = 0; DB.commandes.forEach(c => c.versements.forEach(x => { if (x.date === d) { if (x.mode === 'Espèces') vers += +x.montant; else versMM += +x.montant; } }));
  const mv = DB.mouvements.filter(m => m.date === d);
  const entr = sum(mv.filter(m => m.type === 'entrée'), m => m.montant), sort = sum(mv.filter(m => m.type === 'sortie'), m => m.montant);
  const dep = sum(DB.depenses.filter(x => x.date === d && x.caisse), x => x.montant) + sum(DB.entrees.filter(x => x.date === d && x.caisse), x => x.montant);
  const theo = fond + ventesEsp + vers + entr - sort - dep;
  return { fond, ventesEsp, ventesMM, vers, versMM, entr, sort, dep, theo, compte: j.compte, mv };
}
const cmdPaid = c => sum(c.versements, x => x.montant);

/* ---- équipe, salaires, résultat, produits ---- */
const vName = id => DB.vendeuses.find(v => v.id === id)?.nom || '';
const normN = s => String(s || '').trim().toLowerCase();
const cogsOf = vs => sum(vs, v => sum(v.lignes, l => l.q * (art(l.a)?.cout || 0)));
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
const payDay = () => Math.min(28, Math.max(1, +DB.settings.jourPaie || 28));
function nextPayday() {
  const t = today(), jp = payDay(); let d = t.slice(0, 7) + '-' + pad(jp);
  if (d < t) { const [y, mo] = t.slice(0, 7).split('-').map(Number); const n = new Date(y, mo, 1); d = n.getFullYear() + '-' + pad(n.getMonth() + 1) + '-' + pad(jp); }
  return d;
}
/* salaire d'une vendeuse pour un mois : fixe + commission sur ses ventes */
function salaireDe(v, m) {
  const from = m + '-01', to = m + '-31';
  const vs = DB.ventes.filter(x => x.vendeuse === v.id && x.date >= from && x.date <= to);
  const ca = sum(vs, x => x.total), marge = ca - cogsOf(vs);
  const actif = !v.debut || m >= v.debut.slice(0, 7);
  const base = v.base === 'marge' ? marge : ca;
  const comm = Math.round(base * (+v.taux || 0) / 100), fixe = actif ? (+v.fixe || 0) : 0, du = fixe + comm;
  const paye = sum(DB.paies.filter(p => p.v === v.id && p.mois === m), p => p.montant);
  return { n: vs.length, ca, marge, comm, fixe, du, paye, reste: Math.max(0, du - paye) };
}
/* résultat du mois : CA − coût des marchandises = marge ; marge − charges = bénéfice net */
function resultatMois(m) {
  const from = m + '-01', to = m + '-31';
  const vs = DB.ventes.filter(v => v.date >= from && v.date <= to);
  const ca = sum(vs, v => v.total), cogs = cogsOf(vs), marge = ca - cogs;
  const autres = sum(DB.depenses.filter(d => d.date >= from && d.date <= to && d.fonds === 'charges' && !d.paie), d => d.montant);
  const sal = sum(DB.vendeuses, v => salaireDe(v, m).du);
  const charges = autres + sal, net = marge - charges;
  return { ca, cogs, marge, taux: ca ? marge / ca * 100 : 0, autres, sal, charges, net, n: vs.length };
}
function freqByArticle(from, to) {
  const m = {};
  DB.ventes.forEach(v => {
    if (v.date < from || v.date > to) return; const seen = new Set();
    v.lignes.forEach(l => { const o = m[l.a] = m[l.a] || { n: 0, q: 0, days: new Set() }; o.q += l.q; if (!seen.has(l.a)) { seen.add(l.a); o.n++; o.days.add(v.date); } });
  });
  return m;
}
/* produit le plus récurrent = présent dans le plus grand nombre de ventes (pas seulement le plus de pièces) */
function topRecurrent(m) {
  const f = freqByArticle(m + '-01', m + '-31'), nv = DB.ventes.filter(v => v.date.startsWith(m)).length;
  const rows = Object.entries(f).filter(([id]) => art(id)?.type === 'Produit').map(([id, o]) => ({ a: art(id), n: o.n, q: o.q, jours: o.days.size })).sort((x, y) => y.n - x.n || y.q - x.q);
  return { rows, nv };
}
function margeRows(from, to) {
  const qa = qtyByArticle(from, to);
  return DB.articles.filter(a => a.type === 'Produit' && a.prix > 0).map(a => {
    const q = qa[a.id]?.q || 0, ca = qa[a.id]?.ca || 0, unit = a.prix - a.cout;
    return { a, q, ca, unit, taux: unit / a.prix * 100, marge: ca - q * a.cout };
  });
}
/* classe chaque produit : forte marge / faible marge × bien vendu / peu vendu. Renvoie le seuil de « forte marge » (médiane) */
function lectureMarges(rows) {
  const med = arr => { const s = arr.slice().sort((x, y) => x - y); return s.length ? s[Math.floor(s.length / 2)] : 0; };
  const medT = med(rows.map(r => r.taux)), medQ = med(rows.map(r => r.q));
  rows.forEach(r => { const hm = r.taux >= medT, hv = r.q > medQ; r.cls = hm && hv ? ['Vedette', 'p-good'] : hm ? ['À pousser', 'p-info'] : hv ? ['Gros volume', 'p-warn'] : ['À revoir', 'p-bad']; });
  return medT;
}
function groupDemandes() {
  const g = {};
  DB.demandes.forEach(d => {
    if (d.statut === 'Ignorée') return; const k = normN(d.produit);
    const o = g[k] = g[k] || { k, nom: d.produit, n: 0, q: 0, open: 0 };
    o.n++; o.q += +d.q || 1; if (d.statut === 'Ouverte') o.open++;
  });
  return Object.values(g).sort((a, b) => b.open - a.open || b.n - a.n || b.q - a.q);
}
function alertesPaie() {
  if (!DB.vendeuses.length) return '';
  const t = today(), m = t.slice(0, 7), pm = prevMonth(m);
  const rp = sum(DB.vendeuses, v => salaireDe(v, pm).reste), rc = sum(DB.vendeuses, v => salaireDe(v, m).reste), msgs = [];
  if (rp > 0) msgs.push(`Salaires de <b>${MOIS[+pm.slice(5) - 1]}</b> non payés : <b>${F(rp)}</b>`);

function barChart(data, { h = 190, hlLast = true, fmtV = F } = {}) {
  if (!data.length) return '<div class="empty">Pas encore de données</div>';
  const W = 640, pl = 46, pr = 6, pt = 10, pb = 24, max = Math.max(1, ...data.map(d => d.v));
  const step = niceStep(max), top = Math.ceil(max / step) * step;
  const bw = (W - pl - pr) / data.length, y = v => pt + (h - pt - pb) * (1 - v / top);
  let s = `<svg viewBox="0 0 ${W} ${h}" role="img" aria-label="Graphique">`;
  for (let t = 0; t <= top + 1; t += step) s += `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${pl - 6}" y="${y(t) + 3.5}" text-anchor="end">${short(t)}</text>`;
  const every = Math.ceil(data.length / 10);
  data.forEach((d, i) => {
    const x = pl + i * bw, bh = Math.max(d.v > 0 ? 2 : 0, h - pb - y(d.v)), w = Math.max(2, bw - 3);
    const r = Math.min(4, w / 2, bh);
    const path = bh > 0 ? `M${x + 1.5},${h - pb} V${h - pb - bh + r} q0,-${r} ${r},-${r} H${x + 1.5 + w - r} q${r},0 ${r},${r} V${h - pb} Z` : '';
    s += `<g data-tip="${esc(d.tip || d.l)} · ${esc(fmtV(d.v))}"><rect class="hit" x="${x}" y="${pt}" width="${bw}" height="${h - pt - pb}"/>${path ? `<path class="bar${hlLast && i === data.length - 1 ? ' hl' : ''}" d="${path}"/>` : ''}</g>`;
    if (i % every === 0) s += `<text class="ax" x="${x + bw / 2}" y="${h - 7}" text-anchor="middle">${esc(d.l)}</text>`;
  });
  return `<div class="chart">${s}</svg></div>`;
}
function niceStep(max) { const raw = max / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function short(v) { return v >= 1e6 ? (v / 1e6).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' M' : v >= 1e3 ? Math.round(v / 1e3) + ' k' : String(Math.round(v)); }

        ${openC.length ? `<div class="small muted" style="margin-top:8px">Reste à encaisser : <b>${F(resteC)}</b></div>` : ''}</div>

/* ================= VENTES ================= */
function vVente() {
  const right = `<div class="seg" role="tablist"><button class="${UI.vMode === 'caisse' ? 'on' : ''}" data-act="vMode" data-m="caisse">Caisse rapide</button><button class="${UI.vMode === 'fiche' ? 'on' : ''}" data-act="vMode" data-m="fiche">Fiche du jour</button><button class="${UI.vMode === 'hist' ? 'on' : ''}" data-act="vMode" data-m="hist">Historique</button></div>`;
  const sub = { caisse: 'Touchez un article pour l\'ajouter au panier, puis encaissez.', fiche: 'Comme votre fiche Excel : saisissez la quantité vendue de chaque article pour la journée.', hist: 'Toutes les ventes enregistrées, jour par jour.' }[UI.vMode];
  return header('Ventes', { caisse: 'Caisse rapide', fiche: 'Fiche de vente du jour', hist: 'Historique des ventes' }[UI.vMode], sub, right) +
    (UI.vMode === 'caisse' ? vPOS() : UI.vMode === 'fiche' ? vFiche() : vHist());

function prodFilter(list) {
  const q = UI.q.trim().toLowerCase();
  return list.filter(a => a.type === 'Produit' && (UI.cat === 'Tous' || a.cat === UI.cat) && (!q || a.nom.toLowerCase().includes(q)));
}
function vPOS() {

  return `<div class="pos-wrap"><div>
    <div class="row"><div class="search">${ic('search')}<input class="inp" id="posq" data-in="q" placeholder="Rechercher un article…" value="${esc(UI.q)}" data-autofocus></div><input type="date" class="inp" style="width:auto" id="vdate" data-in="vDate" value="${UI.vDate}" aria-label="Date de la vente">${sellerBtn()}<button class="btn" data-act="newDem" data-p="" title="Un client cherche un article que vous n'avez pas">${ic('plus')}Produit demandé</button></div>
    <div class="chips" style="margin-top:10px">${cats.map(c => `<button class="chip ${UI.cat === c ? 'on' : ''}" data-act="cat" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <div class="prods">${list.map(a => { const s = sm[a.id].actuel, inC = UI.cart.find(l => l.a === a.id); return `<button class="prod ${s <= 0 ? 'out' : s <= a.seuil ? 'low' : ''}" data-act="addCart" data-id="${a.id}">${inC ? `<span class="q">${inC.q}</span>` : ''}<span class="nm">${esc(a.nom)}</span><span class="st">${s <= 0 ? 'Rupture' : s + ' en stock'}</span><span class="pr">${F(a.prix)}</span></button>`; }).join('') || `<div class="empty">Aucun article trouvé${UI.q.trim() ? `<br><button class="btn sm och" style="margin-top:8px" data-act="newDem" data-p="${esc(UI.q.trim())}">Noter « ${esc(UI.q.trim())} » comme produit demandé</button>` : ''}</div>`}</div>
  </div>
  <aside class="card cart"><div class="card-h" style="margin:0"><h2>Panier</h2>${UI.cart.length ? `<button class="btn sm ghost" data-act="clearCart">Vider</button>` : ''}</div>
    <div>${UI.cart.map((l, i) => `<div class="cl"><div class="nm">${esc(artName(l.a))}</div><button class="btn sm ghost" data-act="rmCart" data-i="${i}" aria-label="Retirer">${ic('x', 14)}</button>
      <div class="row"><span class="qty"><button data-act="qCart" data-i="${i}" data-d="-1" aria-label="Moins">−</button><input id="cq${i}" data-in="cartQ" data-i="${i}" value="${l.q}" inputmode="numeric" aria-label="Quantité"><button data-act="qCart" data-i="${i}" data-d="1" aria-label="Plus">+</button></span><span class="small muted">×</span><input class="inp qin num" id="cp${i}" data-in="cartP" data-i="${i}" value="${l.p}" inputmode="numeric" aria-label="Prix unitaire" style="width:90px;padding:5px 8px"></div>
      <div class="num bold" style="align-self:center">${F(l.q * l.p)}</div></div>`).join('') || '<div class="empty">Le panier est vide.<br>Touchez un article à gauche.</div>'}</div>
    <div class="fgrid">
      <div class="field"><label for="remise">Remise (F)</label><input class="inp num" id="remise" data-in="remise" value="${UI.remise || ''}" placeholder="0" inputmode="numeric"></div>
      <div class="field"><label for="mode">Paiement</label><select class="inp" id="mode" data-in="mode">${MODES.map(m => `<option ${UI.mode === m ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
      <div class="field full"><label for="client">Client (facultatif)</label><input class="inp" id="client" data-in="client" value="${esc(UI.client)}" placeholder="Nom du client"></div>
    </div>
    <div class="total-box"><div class="small" style="opacity:.8">${sum(UI.cart, l => l.q)} article(s)${UI.remise ? ' · remise ' + F(UI.remise) : ''}</div><div class="big">${F(tot)}</div></div>
    <button class="btn pri" style="justify-content:center;padding:12px" data-act="checkout" ${UI.cart.length ? '' : 'disabled'}>${ic('check')}Encaisser la vente</button>

}
function vFiche() {
  const sm = stockMap(); const list = prodFilter(DB.articles);
  const f = UI.fiche; const tq = sum(Object.values(f)); const tm = sum(Object.entries(f), ([id, q]) => q * (art(id)?.prix || 0));

    <div class="field"><label for="fmode">Paiement</label><select class="inp" id="fmode" data-in="mode">${MODES.map(m => `<option ${UI.mode === m ? 'selected' : ''}>${m}</option>`).join('')}</select></div></div>
    <div class="tw tall"><table class="sticky"><thead><tr><th>Article</th><th>Catégorie</th><th class="n">Prix</th><th class="n">En stock</th><th class="n">Qté vendue</th><th class="n">Montant</th></tr></thead><tbody>
    ${list.map(a => `<tr><td class="bold">${esc(a.nom)}</td><td class="muted small">${esc(a.cat)}</td><td class="n">${fmt(a.prix)}</td><td class="n ${sm[a.id].actuel <= a.seuil ? 'neg' : ''}">${sm[a.id].actuel}</td><td class="n"><input class="inp qin num" id="fi_${a.id}" data-in="fiche" data-id="${a.id}" value="${f[a.id] || ''}" placeholder="0" inputmode="numeric"></td><td class="n bold" id="fm_${a.id}">${f[a.id] ? fmt(f[a.id] * a.prix) : '–'}</td></tr>`).join('')}

      <div class="row" style="gap:28px"><div class="kpi"><div class="l">Total quantité articles</div><div class="v" id="ftq">${tq}</div></div><div class="kpi"><div class="l">Total argent du jour</div><div class="v" id="ftm">${fmt(tm)} <small>F</small></div></div></div>
      <div class="row"><button class="btn" data-act="ficheClear">Effacer</button><button class="btn pri" data-act="ficheSave">${ic('check')}Enregistrer la fiche</button></div>

    ${done.length ? `<p class="small muted" style="margin:12px 0 0">Déjà enregistré ce jour : ${done.length} vente(s) pour ${F(sum(done, v => v.total))}. La fiche s'ajoute à ces ventes.</p>` : ''}

function vHist() {

    <div class="tw"><table><thead><tr><th>Heure</th><th>Articles</th><th>Client</th><th>Vendeuse</th><th>Paiement</th><th class="n">Remise</th><th class="n">Total</th><th></th></tr></thead><tbody>

      <td class="n"><button class="btn sm ghost" data-act="ticket" data-id="${v.id}">Ticket</button><button class="btn sm ghost danger" data-act="delVente" data-id="${v.id}" aria-label="Supprimer">${ic('trash', 14)}</button></td></tr>`).join('') || `<tr><td colspan="8" class="empty">Aucune vente le ${fDate(d)}</td></tr>`}
    </tbody></table></div></div>`;

/* ================= CAISSE ================= */
function vCaisse() {
  const d = UI.cDate, c = caisseDay(d); const ecart = c.compte != null ? c.compte - c.theo : null;
  const rows = [
    ['Fond de caisse à l\'ouverture', c.fond, ''], ['Ventes payées en espèces', c.ventesEsp, '+'], ['Acomptes clients reçus en espèces', c.vers, '+'],
    ['Autres entrées d\'argent', c.entr, '+'], ['Dépenses payées depuis la caisse', c.dep, '−'], ['Sorties d\'argent (banque, monnaie…)', c.sort, '−']
  ];
  const deps = [...DB.depenses.filter(x => x.date === d && x.caisse).map(x => ({ l: x.libelle, m: x.montant, t: 'Dépense' })), ...DB.entrees.filter(x => x.date === d && x.caisse).map(x => ({ l: 'Achat ' + artName(x.a), m: x.montant, t: 'Achat stock' }))];

      <div class="field" style="max-width:260px;margin-bottom:10px"><label for="fond">Fond de caisse déposé ce matin (F)</label><input class="inp num" id="fond" data-in="fond" value="${c.fond}" inputmode="numeric"></div>
      <table><tbody>${rows.slice(1).map(r => `<tr><td>${r[0]}</td><td class="n ${r[2] === '+' ? 'pos' : 'neg'}">${r[2]} ${fmt(r[1])}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Argent attendu dans la caisse</td><td class="n" style="font-size:1.1rem">${F(c.theo)}</td></tr></tfoot></table>
      <div class="grid g2" style="margin-top:16px;align-items:end">
        <div class="field"><label for="compte">Montant compté le soir (F)</label><input class="inp num" id="compte" data-in="compte" value="${c.compte ?? ''}" placeholder="Comptez les billets et pièces" inputmode="numeric"></div>
        <div>${ecart == null ? '<span class="pill p-mute">Caisse pas encore comptée</span>' : ecart === 0 ? '<span class="pill p-good">Caisse juste</span>' : `<span class="pill ${ecart > 0 ? 'p-warn' : 'p-bad'}">${ecart > 0 ? 'Excédent' : 'Manquant'} de ${F(Math.abs(ecart))}</span>`}</div>
      </div>
      <p class="small muted" style="margin:12px 0 0">Mobile money du jour (hors tiroir) : <b>${F(c.ventesMM + c.versMM)}</b> · le montant compté devient le fond du lendemain.</p>
    </div>
    <div class="card"><div class="card-h"><h2>Mouvements manuels</h2><button class="btn sm pri" data-act="newMvt">${ic('plus')}Ajouter</button></div>
      ${c.mv.map(m => `<div class="list-item"><span>${esc(m.libelle)}<br><span class="small muted">${m.type === 'entrée' ? 'Entrée' : 'Sortie'}</span></span><span class="row"><b class="num ${m.type === 'entrée' ? 'pos' : 'neg'}">${m.type === 'entrée' ? '+' : '−'} ${fmt(m.montant)}</b><button class="btn sm ghost danger" data-act="delMvt" data-id="${m.id}" aria-label="Supprimer">${ic('trash', 14)}</button></span></div>`).join('') || '<div class="empty">Aucun mouvement manuel ce jour</div>'}

/* ================= STOCK ================= */
function vStock() {

    `<div class="seg"><button class="${tab === 'etat' ? 'on' : ''}" data-act="stab" data-t="etat">État du stock</button><button class="${tab === 'entrees' ? 'on' : ''}" data-act="stab" data-t="entrees">Entrées</button><button class="${tab === 'reappro' ? 'on' : ''}" data-act="stab" data-t="reappro">À commander</button></div><button class="btn pri" data-act="newEntree">${ic('plus')}Entrée de stock</button>`) +
    (tab === 'etat' ? vStockEtat() : tab === 'entrees' ? vEntrees() : vReappro());

function vStockEtat() {
  const sm = stockMap(); const q = UI.sq.toLowerCase();
  let list = DB.articles.filter(a => !q || a.nom.toLowerCase().includes(q));
  if (UI.sFilter === 'Alertes') list = list.filter(a => sm[a.id].actuel <= a.seuil);
  if (UI.sFilter === 'Matières premières') list = list.filter(a => a.type !== 'Produit');
  const val = a => Math.max(0, sm[a.id].actuel) * (a.type === 'Produit' ? a.prix : a.cout);
  const valAchat = sum(DB.articles, a => Math.max(0, sm[a.id].actuel) * a.cout);
  const rotSorted = DB.articles.filter(a => a.type === 'Produit').sort((a, b) => sm[b.id].rot - sm[a.id].rot);
  return `<div class="grid g4" style="margin-bottom:16px">

    <div class="card kpi"><div class="l">Valeur au prix d'achat</div><div class="v">${fmt(valAchat)} <small>F</small></div></div>
    <div class="card kpi"><div class="l">Alertes</div><div class="v ${DB.articles.some(a => sm[a.id].actuel <= a.seuil) ? 'neg' : ''}">${DB.articles.filter(a => sm[a.id].actuel <= a.seuil).length}</div><div class="s">ruptures + stocks faibles</div></div></div>
  <div class="grid g-main"><div class="card"><div class="row" style="margin-bottom:10px"><div class="search">${ic('search')}<input class="inp" id="sq" data-in="sq" placeholder="Rechercher…" value="${esc(UI.sq)}"></div><div class="chips">${['Tous', 'Alertes', 'Matières premières'].map(f => `<button class="chip ${UI.sFilter === f ? 'on' : ''}" data-act="sFilter" data-f="${f}">${f}</button>`).join('')}</div></div>
  <div class="tw tall"><table class="sticky"><thead><tr><th>Article</th><th class="n">Initial</th><th class="n">Entrées</th><th class="n">Ventes</th><th class="n">Atelier</th><th class="n">Actuel</th><th>Alerte</th><th class="n">Valeur</th><th class="n">Rotation</th></tr></thead><tbody>
  ${list.map(a => { const s = sm[a.id], [l, c] = stockStatus(a, s); return `<tr><td class="bold">${esc(a.nom)}<br><span class="small muted" style="font-weight:400">${esc(a.cat)}</span></td><td class="n">${s.init}</td><td class="n">${s.ent || '–'}</td><td class="n">${s.vte || '–'}</td><td class="n small">${s.atOut ? '−' + s.atOut : ''}${s.atIn ? ' +' + s.atIn : ''}${!s.atOut && !s.atIn ? '–' : ''}</td><td class="n bold ${s.actuel <= 0 ? 'neg' : ''}">${s.actuel}</td><td><span class="pill ${c}">${l}</span></td><td class="n">${fmt(val(a))}</td><td class="n">${a.type === 'Produit' ? s.rot.toFixed(2) : '–'}</td></tr>`; }).join('')}
  </tbody></table></div></div>

/* ================= SYSTÈME FINANCIER ================= */
function vFinance() {
  const m = UI.month, sp = DB.settings.split, last = m + '-' + pad(daysInMonth(m)), t = today();
  const byDay = salesByDay();
  // solde cumulé du fonds Stock (et des autres) avant le mois
  const before = fundBalances(addDays(m + '-01', -1));
  const run = { stock: before.stock.solde, charges: before.charges.solde, reserve: before.reserve.solde, profit: before.profit.solde };
  const rows = [];
  for (let d = m + '-01'; d <= last && d <= t; d = addDays(d, 1)) {
    const ca = byDay[d] || 0, r = retraits(d, d);
    const al = {}; FUNDS.forEach(f => { al[f.k] = ca * sp[f.k] / 100; run[f.k] += al[f.k] - r[f.k]; });
    if (ca || r.stock || r.charges || r.reserve || r.profit) rows.push({ d, ca, al, r, run: { ...run } });
  }
  const T = k => sum(rows, x => x.al[k]);
  const caM = sum(rows, x => x.ca);
  return header('Argent', 'Système financier', `Chaque franc vendu est réparti : Stock ${sp.stock} %, Charges ${sp.charges} %, Réserve ${sp.reserve} %, Profit ${sp.profit} %. Les cumuls vous disent combien vous pouvez dépenser.`,
    monthPicker('month', m) + `<button class="btn" data-act="go" data-v="params">Changer la répartition</button>`) +
    `<div class="grid g4" style="margin-bottom:16px">${FUNDS.map(f => `<div class="card kpi fund" style="--c:${f.c}"><div class="row" style="justify-content:space-between"><span class="l">${f.n} · ${fMonth(m)}</span><span class="pct">${sp[f.k]} %</span></div><div class="v">${fmt(T(f.k))} <small>F</small></div><div class="s">Disponible fin de période : <b class="${run[f.k] < 0 ? 'neg' : ''}">${F(run[f.k])}</b></div></div>`).join('')}</div>
    <div class="card"><div class="card-h"><h2>Répartition jour par jour</h2><span class="sub">CA du mois ${F(caM)}</span></div>
    <div class="tw tall"><table class="sticky"><thead><tr><th>Date</th><th class="n">Vente du jour</th>${FUNDS.map(f => `<th class="n">${f.n} ${sp[f.k]} %</th>`).join('')}<th class="n">Retrait stock</th><th class="n">Cumul stock dispo</th><th class="n">Cumul charges</th><th class="n">Cumul réserve</th><th class="n">Cumul profit</th></tr></thead><tbody>
    ${rows.map(x => `<tr><td class="num">${fDate(x.d)}</td><td class="n bold">${fmt(x.ca)}</td>${FUNDS.map(f => `<td class="n">${fmt(x.al[f.k])}</td>`).join('')}<td class="n ${x.r.stock ? 'neg' : 'muted'}">${x.r.stock ? '−' + fmt(x.r.stock) : '–'}</td><td class="n bold">${fmt(x.run.stock)}</td><td class="n">${fmt(x.run.charges)}</td><td class="n">${fmt(x.run.reserve)}</td><td class="n">${fmt(x.run.profit)}</td></tr>`).join('') || `<tr><td colspan="11" class="empty">Aucune vente en ${fMonth(m)}</td></tr>`}
    </tbody>${rows.length ? `<tfoot><tr><td>Total</td><td class="n">${fmt(caM)}</td>${FUNDS.map(f => `<td class="n">${fmt(T(f.k))}</td>`).join('')}<td class="n">${fmt(sum(rows, x => x.r.stock))}</td><td colspan="4"></td></tr></tfoot>` : ''}</table></div>
    <p class="small muted" style="margin:12px 0 0">Le « cumul stock dispo » est le montant que vous pouvez utiliser pour racheter de la marchandise : cumul des 65 % moins les achats déjà faits. Les cumuls reprennent le solde des mois précédents.</p></div>`;
}

/* ================= TRÉSORERIE & CHARGES ================= */
function vTreso() {
  const m = UI.month, from = m + '-01', to = m + '-31';

  const deps = DB.depenses.filter(d => d.date >= from && d.date <= to).sort((a, b) => b.date.localeCompare(a.date));
  const achats = sum(DB.entrees.filter(e => e.date >= from && e.date <= to), e => e.montant);
  const totalOut = achats + sum(deps, d => d.montant);
  const paidBy = {}; deps.filter(d => d.fonds === 'charges').forEach(d => paidBy[d.type] = (paidBy[d.type] || 0) + d.montant);
  const budgetTot = sum(DB.budget, b => b.montant); const paidBudget = sum(DB.budget, b => Math.min(b.montant, paidBy[b.nom] || 0));
  const reste = Math.max(0, budgetTot - paidBudget);
  return header('Argent', 'Trésorerie & charges', 'Le chiffre d\'affaires du mois, toutes les dépenses à prélever, et le suivi des charges fixes et de la réserve.',

    </div>

      <div class="tw"><table><thead><tr><th>Date</th><th>Libellé</th><th>Prélevé sur</th><th class="n">Montant</th><th></th></tr></thead><tbody>
      ${deps.map(d => { const f = FUNDS.find(x => x.k === d.fonds); return `<tr><td class="num small">${fDate(d.date)}</td><td><b>${esc(d.libelle)}</b><br><span class="small muted">${esc(d.type)}${d.caisse ? ' · payé depuis la caisse' : ''}</span></td><td><span class="pill p-mute">${f?.n}</span></td><td class="n bold">${fmt(d.montant)}</td><td class="n"><button class="btn sm ghost danger" data-act="delDep" data-id="${d.id}" aria-label="Supprimer">${ic('trash', 14)}</button></td></tr>`; }).join('') || '<tr><td colspan="5" class="empty">Aucune dépense ce mois-ci</td></tr>'}
      </tbody></table></div></div>
      <div class="grid" style="align-content:start">
        <div class="card"><div class="card-h"><h2>Fonds charges</h2><button class="btn sm" data-act="editBudget">Budget mensuel</button></div>
          <div class="row" style="justify-content:space-between"><span class="small muted">Mis de côté ce mois (${sp.charges} %)</span><b class="num">${F(ca * sp.charges / 100)}</b></div>
          <div class="row" style="justify-content:space-between"><span class="small muted">Charges payées ce mois</span><b class="num">${F(r.charges)}</b></div>
          <div class="row" style="justify-content:space-between"><span class="small muted">Disponible (cumul)</span><b class="num ${fb.charges.solde < 0 ? 'neg' : ''}">${F(fb.charges.solde)}</b></div>
          <div style="margin-top:12px">${DB.budget.map(b => { const p = paidBy[b.nom] || 0, pct = b.montant ? Math.min(100, p / b.montant * 100) : 0; return `<div style="margin:8px 0"><div class="row small" style="justify-content:space-between"><span>${esc(b.nom)}</span><span class="num">${fmt(p)} / ${fmt(b.montant)}</span></div><div class="meter"><i style="width:${pct}%;${pct < 100 ? 'background:var(--warn)' : ''}"></i></div></div>`; }).join('')}</div>
          <div style="margin-top:10px">${reste === 0 ? '<span class="pill p-good">Toutes les charges prévues sont payées</span>' : fb.charges.solde >= reste ? `<span class="pill p-good">Fonds suffisant pour les ${F(reste)} restants</span>` : `<span class="pill p-bad">Il manque ${F(reste - fb.charges.solde)} pour couvrir les charges</span>`}</div>
        </div>
        <div class="card"><div class="card-h"><h2>Réserve & profit</h2></div>
          ${['reserve', 'profit'].map(k => `<div class="list-item"><span>${FUNDS.find(f => f.k === k).n}<br><span class="small muted">+${F(ca * sp[k] / 100)} ce mois · −${F(r[k])} retirés</span></span><b class="num">${F(fb[k].solde)}</b></div>`).join('')}

/* ================= ANALYSE MENSUELLE ================= */
function vAnalyse() {
  const m = UI.month, from = m + '-01', to = m + '-31';
  const rows = margeRows(from, to).sort((x, y) => y.q - x.q); const medT = lectureMarges(rows);
  const fq = freqByArticle(from, to); rows.forEach(r => r.n = fq[r.a.id]?.n || 0);
  const nv = DB.ventes.filter(v => v.date >= from && v.date <= to).length, rs = resultatMois(m);
  const caM = sum(rows, r => r.ca), best = rows[0], unsold = rows.filter(r => !r.q), sold = rows.filter(r => r.q > 0);
  const rec = rows.slice().sort((x, y) => y.n - x.n || y.q - x.q)[0];
  const topM = sold.slice().sort((x, y) => y.marge - x.marge)[0];
  const byDay = salesByDay(); const days = []; for (let i = 1; i <= daysInMonth(m); i++) { const d = m + '-' + pad(i); if (d > today()) break; days.push({ l: String(i), v: byDay[d] || 0, tip: fDate(d) }); }
  const byCat = {}; rows.forEach(r => byCat[r.a.cat] = (byCat[r.a.cat] || 0) + r.ca);
  const byMode = {}; DB.ventes.filter(v => v.date >= from && v.date <= to).forEach(v => byMode[v.mode] = (byMode[v.mode] || 0) + v.total);
  const pm = prevMonth(m), caP = caOf(pm + '-01', pm + '-31');
  const grp = c => rows.filter(r => r.cls[0] === c).sort((x, y) => y.marge - x.marge || y.taux - x.taux).slice(0, 4).map(r => esc(r.a.nom)).join(', ');
  const lect = [
    ['Vedette', 'p-good', 'forte marge et bien vendus', 'Ne tombez jamais en rupture sur ces articles.'],
    ['À pousser', 'p-info', 'forte marge mais peu vendus', 'Mettez-les en vitrine et proposez-les en premier au client.'],
    ['Gros volume', 'p-warn', 'bien vendus mais marge faible', 'Cherchez un meilleur prix d\'achat ou augmentez un peu le prix.'],
    ['À revoir', 'p-bad', 'faible marge et peu vendus', 'Rachetez-en moins, ou arrêtez-les.']

  const byTaux = sold.slice().sort((x, y) => y.taux - x.taux).slice(0, 6).map(r => ({ l: r.a.nom, v: r.taux, t: r.taux.toFixed(0) + ' %' }));
  return header('Argent', 'Analyse de ' + fMonth(m), 'Ce qui se vend, ce qui rapporte, ce qui dort.', monthPicker('month', m)) +
    `<div class="grid g4" style="margin-bottom:16px">
      <div class="card kpi"><div class="l">Chiffre d'affaires</div><div class="v">${fmt(caM)} <small>F</small></div><div class="s">${caP ? `<span class="${caM >= caP ? 'pos' : 'neg'} bold">${caM >= caP ? '▲' : '▼'} ${Math.abs((caM - caP) / caP * 100).toFixed(0)} %</span> vs ${MOIS[+pm.slice(5) - 1]}` : ''}</div></div>
      <div class="card kpi"><div class="l">Marge brute estimée</div><div class="v">${fmt(sum(rows, r => r.marge))} <small>F</small></div><div class="s">prix de vente − prix de revient</div></div>
      <div class="card kpi"><div class="l">Article le plus vendu</div><div class="v" style="font-size:1.2rem">${best && best.q ? esc(best.a.nom) : '–'}</div><div class="s">${best && best.q ? best.q + ' pièces · ' + F(best.ca) : ''}</div></div>
      <div class="card kpi"><div class="l">Articles sans aucune vente</div><div class="v ${unsold.length ? 'neg' : ''}">${unsold.length}</div><div class="s">${unsold.slice(0, 3).map(r => esc(r.a.nom)).join(', ')}${unsold.length > 3 ? '…' : ''}</div></div>
    </div>
    <div class="grid g4" style="margin-bottom:16px">
      <div class="card kpi"><div class="l">Charges du mois</div><div class="v">${fmt(rs.charges)} <small>F</small></div><div class="s">salaires ${F(rs.sal)} · autres ${F(rs.autres)}</div></div>
      <div class="card kpi"><div class="l">Bénéfice net</div><div class="v ${rs.net >= 0 ? 'pos' : 'neg'}">${rs.net < 0 ? '− ' : ''}${fmt(Math.abs(rs.net))} <small>F</small></div><div class="s">marge brute − charges</div></div>
      <div class="card kpi"><div class="l">Produit le plus récurrent</div><div class="v" style="font-size:1.2rem">${rec && rec.n ? esc(rec.a.nom) : '–'}</div><div class="s">${rec && rec.n ? `présent dans ${rec.n} vente${rec.n > 1 ? 's' : ''} sur ${nv} (${nv ? Math.round(rec.n / nv * 100) : 0} %) · ${rec.q} pièces` : ''}</div></div>
      <div class="card kpi"><div class="l">Produit le plus rentable</div><div class="v" style="font-size:1.2rem">${topM ? esc(topM.a.nom) : '–'}</div><div class="s">${topM ? `${F(topM.marge)} de marge · ${topM.taux.toFixed(0)} % du prix` : ''}</div></div>
    </div>
    <div class="grid g-main"><div class="card"><div class="card-h"><h2>Ventes par jour</h2><span class="sub">Moyenne ${F(caM / Math.max(1, days.filter(d => d.v).length))} par jour ouvert</span></div>${barChart(days, { hlLast: false })}</div>
    <div class="card"><div class="card-h"><h2>Par catégorie</h2></div>${hbars(Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([l, v]) => ({ l, v, t: short(v) })))}
      <div class="card-h" style="margin:16px 0 6px"><h3>Par moyen de paiement</h3></div>${hbars(Object.entries(byMode).sort((a, b) => b[1] - a[1]).map(([l, v]) => ({ l, v, t: short(v) })), true)}</div></div>
    <div class="grid g-main" style="margin-top:16px"><div class="card"><div class="card-h"><h2>Lecture des marges</h2><span class="sub">« forte marge » = ${medT.toFixed(0)} % ou plus du prix de vente</span></div>${lect || '<div class="empty">Ajoutez des articles avec leur prix de revient</div>'}</div>
    <div class="card"><div class="card-h"><h2>Produits à plus forte marge</h2><span class="sub">% du prix de vente</span></div>${hbars(byTaux, true)}<p class="small muted" style="margin:10px 0 0">Seuls les articles vendus ce mois-ci sont classés. Une forte marge sur un article qui ne se vend pas rapporte peu : regardez aussi la marge totale ci-dessous.</p></div></div>
    <div class="card" style="margin-top:16px"><div class="card-h"><h2>Classement des articles</h2></div><div class="tw tall"><table class="sticky"><thead><tr><th class="n">#</th><th>Article</th><th class="n">Quantité</th><th class="n">Dans … ventes</th><th class="n">Chiffre d'affaires</th><th class="n">Part</th><th class="n">% de marge</th><th class="n">Marge estimée</th><th>Lecture</th></tr></thead><tbody>
    ${rows.map((r, i) => `<tr><td class="n muted">${i + 1}</td><td class="bold">${esc(r.a.nom)}</td><td class="n">${r.q || '<span class="neg">0</span>'}</td><td class="n">${r.n || '–'}</td><td class="n">${fmt(r.ca)}</td><td class="n">${caM ? (r.ca / caM * 100).toFixed(1) + ' %' : '–'}</td><td class="n">${r.taux.toFixed(0)} %</td><td class="n">${fmt(r.marge)}</td><td><span class="pill ${r.cls[1]}">${r.cls[0]}</span></td></tr>`).join('')}
    </tbody></table></div></div>`;
}

/* ============ modales, toast, info-bulles ============ */
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2200); }
let modalSubmit = null;
function modal(title, body, { ok = 'Enregistrer', onOk, wide, extra = '', cancel = 'Annuler', okClass = 'pri' } = {}) {
  modalSubmit = onOk;
  $('#modalRoot').innerHTML = `<div class="ov" data-act="ovClose"><form class="modal${wide ? ' wide' : ''}" id="mform" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mh"><h2>${esc(title)}</h2><button type="button" class="btn sm ghost" data-act="closeModal" aria-label="Fermer">${ic('x', 16)}</button></div><div class="mb">${body}</div><div class="mf">${extra}${cancel ? `<button type="button" class="btn" data-act="closeModal">${cancel}</button>` : ''}${onOk ? `<button type="submit" class="btn ${okClass}">${ok}</button>` : ''}</div></form></div>`;
  const first = $('#mform .mb input:not([type=hidden]), #mform .mb select'); if (first) setTimeout(() => first.focus(), 30);
}
function closeModal() { $('#modalRoot').innerHTML = ''; modalSubmit = null; }
function confirmBox(msg, onYes, ok = 'Confirmer') { modal('Confirmation', `<p style="margin:0">${msg}</p>`, { ok, okClass: 'danger', onOk: () => { onYes(); return true; } }); }
const fv = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
const artOptions = (sel, filter) => DB.articles.filter(filter || (() => true)).map(a => `<option value="${a.id}" ${a.id === sel ? 'selected' : ''}>${esc(a.nom)}</option>`).join('');
const artDatalist = () => `<datalist id="dlArt">${DB.articles.map(a => `<option value="${esc(a.nom)}">`).join('')}</datalist>`;
const artByName = n => DB.articles.find(a => a.nom.toLowerCase() === n.trim().toLowerCase());

document.addEventListener('submit', e => { if (e.target.id === 'mform') { e.preventDefault(); if (modalSubmit && modalSubmit() !== false) { closeModal(); save(); render(); } } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modalRoot').innerHTML) closeModal(); });
document.addEventListener('mousemove', e => {
  const g = e.target.closest?.('[data-tip]'); const tip = $('#tip');
  if (!g) { tip.style.opacity = 0; return; }
  tip.textContent = g.dataset.tip; tip.style.opacity = 1;
  const w = tip.offsetWidth; tip.style.left = Math.min(window.innerWidth - w - 8, e.clientX + 12) + 'px'; tip.style.top = (e.clientY - 34) + 'px';
});

/* ============ actions ============ */
const ACT = {
  menu: () => $('#app').classList.toggle('open'),
  go: d => { UI.view = d.v; try { localStorage.setItem(KEY + '_view', d.v); } catch (e) { } $('#app').classList.remove('open'); render(); window.scrollTo(0, 0); if (d.v === 'vente' && DB.vendeuses.length && !vName(UI.user)) showLogin(); },
  closeModal, ovClose: (d, el, e) => { if (e.target === el) closeModal(); },
  startClean: () => confirmBox('Toutes les données d\'exemple seront effacées. Vous pourrez ensuite saisir vos propres articles.', () => { DB = blankDB(); UI.view = 'articles'; }, 'Commencer à vide'),
  vMode: d => { UI.vMode = d.m; render(); }, cat: d => { UI.cat = d.c; render(); },
  addCart: d => { const a = art(d.id); const l = UI.cart.find(x => x.a === d.id); if (l) l.q++; else UI.cart.push({ a: d.id, q: 1, p: a.prix }); render(); },
  rmCart: d => { UI.cart.splice(+d.i, 1); render(); }, clearCart: () => { UI.cart = []; UI.remise = 0; render(); },
  qCart: d => { const l = UI.cart[+d.i]; l.q = Math.max(1, l.q + +d.d); render(); },
  checkout: () => {
    if (!needUser()) return;
    UI.cart = UI.cart.filter(l => l.q > 0); if (!UI.cart.length) { render(); return; }
    const sm = stockMap(); const over = UI.cart.filter(l => l.q > sm[l.a].actuel);
    const doIt = () => {
      const brut = sum(UI.cart, l => l.q * l.p); const v = { id: uid(), date: UI.vDate, heure: nowTime(), lignes: UI.cart.map(l => ({ ...l })), remise: +UI.remise || 0, total: Math.max(0, brut - (+UI.remise || 0)), mode: UI.mode, client: UI.client, vendeuse: UI.user || '' };
      DB.ventes.push(v); UI.cart = []; UI.remise = 0; UI.client = ''; save(); render(); showTicket(v);
    };
    if (over.length) { modal('Stock insuffisant', `<p style="margin:0">${over.map(l => `<b>${esc(artName(l.a))}</b> : ${sm[l.a].actuel} en stock, ${l.q} demandé(s)`).join('<br>')}</p><p class="small muted">Vous pouvez quand même enregistrer (le stock deviendra négatif, pensez à saisir l'entrée manquante).</p>`, { ok: 'Enregistrer quand même', onOk: () => { setTimeout(doIt); return true; } }); return; }
    doIt();
  },
  ticket: d => showTicket(DB.ventes.find(v => v.id === d.id)),
  printTicket: d => { $('#printArea').innerHTML = ticketHTML(DB.ventes.find(v => v.id === d.id)); window.print(); },

      <div class="field"><label for="dm_q">Quantité voulue</label><input class="inp num" id="dm_q" value="1" inputmode="numeric"></div><div class="field"><label for="dm_c">Client (facultatif)</label><input class="inp" id="dm_c"></div>
      <div class="field"><label for="dm_t">Téléphone (pour le prévenir)</label><input class="inp" id="dm_t" inputmode="tel"></div><div class="field"><label for="dm_n">Précision</label><input class="inp" id="dm_n" placeholder="Couleur, motif, budget…"></div></div>`,
    { onOk: () => { if (!fv('dm_p')) { toast('Indiquez le produit'); return false; } DB.demandes.push({ id: uid(), date: today(), produit: fv('dm_p'), q: Math.max(1, num(fv('dm_q'))), client: fv('dm_c'), tel: fv('dm_t'), note: fv('dm_n'), vendeuse: UI.user || '', statut: 'Ouverte' }); toast('Demande notée'); } }),
  demStat: d => { const x = DB.demandes.find(y => y.id === d.id); if (x) x.statut = d.s; save(); render(); },
  delDem: d => confirmBox('Supprimer cette demande ?', () => { DB.demandes = DB.demandes.filter(x => x.id !== d.id); }, 'Supprimer'),
  demAdd: d => ACT.editArt({ nom: d.p, demande: '1' }),
  /* paramètres */
  exportJSON: () => { const b = new Blob([JSON.stringify(DB)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'pagnepro-sauvegarde-' + today() + '.json'; a.click(); toast('Sauvegarde téléchargée'); },
  exportCSV: () => { const rows = [['Date', 'Heure', 'Article', 'Quantité', 'Prix', 'Montant', 'Paiement', 'Client', 'Vendeuse']]; DB.ventes.forEach(v => v.lignes.forEach(l => rows.push([v.date, v.heure, artName(l.a), l.q, l.p, l.q * l.p, v.mode, v.client || '', vName(v.vendeuse)]))); const csv = '﻿' + rows.map(r => r.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(';')).join('\n'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'ventes-' + today() + '.csv'; a.click(); },
  copyJSON: () => { const s = JSON.stringify(DB); navigator.clipboard?.writeText(s).then(() => toast('Sauvegarde copiée : collez-la dans une note ou WhatsApp'), () => modal('Copier la sauvegarde', `<textarea class="inp" rows="8" id="cpy" readonly>${esc(s)}</textarea>`, { cancel: 'Fermer' })) ?? modal('Copier la sauvegarde', `<textarea class="inp" rows="8" readonly>${esc(s)}</textarea>`, { cancel: 'Fermer' }); },
  pasteImport: () => modal('Coller une sauvegarde', `<textarea class="inp" rows="8" id="pimp" placeholder="Collez ici le texte de la sauvegarde"></textarea>`, { ok: 'Restaurer', onOk: () => importText(fv('pimp')) }),
  resetAll: () => confirmBox('Effacer définitivement toutes les données de cet appareil ?', () => { DB = blankDB(); toast('Données effacées'); }, 'Tout effacer'),
  loadDemo: () => confirmBox('Remplacer vos données par l\'exemple ?', () => { DB = seedDemo(); }, 'Charger l\'exemple')
};
function importText(t) { try { const o = JSON.parse(t); if (!o.articles || !o.ventes) throw 0; DB = Object.assign(blankDB(), o); toast('Sauvegarde restaurée'); return true; } catch (e) { toast('Ce texte n\'est pas une sauvegarde PagnePro valide'); return false; } }

document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; const fn = ACT[b.dataset.act]; if (fn) fn(b.dataset, b, e); });

/* saisies en direct (sans perdre le focus) */
document.addEventListener('input', e => {
  const el = e.target, k = el.dataset.in;
  if (el.dataset.set) { DB.settings[el.dataset.set] = ['lowDays', 'jourPaie'].includes(el.dataset.set) ? num(el.value) : el.value; if (el.dataset.set === 'shop') $('#shopName').textContent = el.value; save(); return; }
  if (el.dataset.split) { DB.settings.split[el.dataset.split] = num(el.value); save(); return; }
  if (!k) return;
  const rerender = (keepId) => { const pos = el.selectionStart; render(); const n = document.getElementById(keepId); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) { } } };
  switch (k) {
    case 'q': UI.q = el.value; rerender(el.id); break;
    case 'sq': UI.sq = el.value; rerender('sq'); break;
    case 'aq': UI.aq = el.value; rerender('aq'); break;
    case 'remise': UI.remise = num(el.value); rerender('remise'); break;
    case 'client': UI.client = el.value; break;
    case 'cartQ': { const l = UI.cart[+el.dataset.i]; l.q = Math.max(0, num(el.value)); if (el.value !== '') rerender(el.id); break; }
    case 'cartP': { UI.cart[+el.dataset.i].p = num(el.value); rerender(el.id); break; }
    case 'fiche': { const q = Math.max(0, Math.floor(num(el.value))); if (q) UI.fiche[el.dataset.id] = q; else delete UI.fiche[el.dataset.id];
      const a = art(el.dataset.id); $('#fm_' + a.id).textContent = q ? fmt(q * a.prix) : '–';
      $('#ftq').textContent = sum(Object.values(UI.fiche)); $('#ftm').innerHTML = fmt(sum(Object.entries(UI.fiche), ([id, x]) => x * (art(id)?.prix || 0))) + ' <small>F</small>'; break; }
    case 'cmdCalc': { let t = 0; for (let i = 0; i < 4; i++) { const a = artByName(fv('ca_' + i)); if (a) t += a.prix * Math.max(1, num(fv('cq_' + i))); } const tot = $('#k_tot'); if (tot && !tot.dataset.touched) tot.value = t || ''; break; }
    case 'entCalc': { const a = artByName(fv('e_a')), q = num(fv('e_q')); if (a) $('#e_m').placeholder = q ? 'Prix de revient : ' + F(q * a.cout) : 'Prix de revient ' + F(a.cout) + ' / pièce'; break; }
    case 'fond': { const d = UI.cDate; DB.caisseJours[d] = DB.caisseJours[d] || {}; DB.caisseJours[d].fond = el.value === '' ? null : num(el.value); save(); break; }
    case 'compte': { const d = UI.cDate; DB.caisseJours[d] = DB.caisseJours[d] || {}; DB.caisseJours[d].compte = el.value === '' ? null : num(el.value); save(); break; }
  }
});
document.addEventListener('change', e => {
  const el = e.target, k = el.dataset.in; if (!k) return;
  if (k === 'vDate') { UI.vDate = el.value || today(); render(); }
  else if (k === 'cDate') { UI.cDate = el.value || today(); render(); }
  else if (k === 'month') { UI.month = el.value || today().slice(0, 7); render(); }
  else if (k === 'mode') { UI.mode = el.value; }
  else if (k === 'fond' || k === 'compte') render();
  else if (k === 'theme') { UI.theme = el.value; applyTheme(); }
  else if (k === 'import') { const f = el.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { if (importText(r.result)) { save(); render(); } }; r.readAsText(f); }
});
document.addEventListener('focusin', e => { if (e.target.id === 'k_tot') e.target.addEventListener('keydown', () => e.target.dataset.touched = 1, { once: true }); });
function applyTheme() { try { UI.theme ? localStorage.setItem(KEY + '_theme', UI.theme) : localStorage.removeItem(KEY + '_theme'); } catch (e) { } if (UI.theme) document.documentElement.setAttribute('data-theme', UI.theme); else document.documentElement.removeAttribute('data-theme'); }
try { UI.theme = localStorage.getItem(KEY + '_theme') || ''; if (UI.theme) document.documentElement.setAttribute('data-theme', UI.theme); } catch (e) { }

load();
try { const u = localStorage.getItem(KEY + '_user'); if (u && DB.vendeuses.some(v => v.id === u)) UI.user = u; } catch (e) { }
render();
if (UI.view === 'vente' && DB.vendeuses.length && !vName(UI.user)) showLogin();
</script></body></html>
