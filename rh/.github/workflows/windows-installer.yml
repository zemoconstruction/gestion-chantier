name: Installateur Windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --onefile --noconsole --name RHPro --add-data "templates;templates" --hidden-import waitress main.py
      - run: choco install innosetup -y --no-progress
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\RHPro.iss'
      - uses: actions/upload-artifact@v4
        with: { name: RHPro-Setup, path: dist/RHPro-Setup.exe }
      - name: Publier dans les Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: dist/RHPro-Setup.exe }
