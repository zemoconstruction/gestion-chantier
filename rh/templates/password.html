{% extends "base.html" %}{% block body %}
<h1>Mon mot de passe</h1><p class="sub">8 caractères minimum.</p>
<form method="post" class="card" style="max-width:420px"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
<label>Mot de passe actuel</label><input type="password" name="actuel" required><br><br>
<label>Nouveau mot de passe</label><input type="password" name="nouveau" minlength="8" required><br><br>
<button class="btn">Enregistrer</button></form>{% endblock %}
